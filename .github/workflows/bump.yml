name: bump version

# One-click release from the Actions tab. Bumps package.json (+ lockfile) on
# dev and opens the dev → main release PR.
#
# It authenticates with a user token (RELEASE_TOKEN secret) rather than the
# built-in GITHUB_TOKEN, because pushes/PRs made by GITHUB_TOKEN do NOT trigger
# other workflows — so the required CI check would never run. A real token
# makes CI run on the PR, so it can actually merge.
#
# Setup (once per repo): create a fine-grained PAT with this repo's
# Contents: Read/write + Pull requests: Read/write, and add it as the
# RELEASE_TOKEN Actions secret.
on:
  workflow_dispatch:
    inputs:
      level:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Check RELEASE_TOKEN is configured
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error title=Missing RELEASE_TOKEN::Create a fine-grained PAT (Contents + Pull requests: Read/write) and add it as the RELEASE_TOKEN Actions secret."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }} # so the push/PR trigger CI
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Bump version on dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.level }} --no-git-tag-version
          v=$(node -p "require('./package.json').version")
          echo "VERSION=$v" >> "$GITHUB_ENV"
          git commit -am "chore: bump version to $v for release"
          git push origin dev
      - name: Open the dev → main release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          existing="$(gh pr list --base main --head dev --state open --json number -q '.[0].number' || true)"
          if [ -n "$existing" ]; then
            echo "dev → main PR #$existing already open; the bump was added to it."
          else
            gh pr create --base main --head dev \
              --title "Release v$VERSION" \
              --body "Automated bump to **v$VERSION**. Merging deploys \`main\` and tags the release with auto-generated notes."
          fi
