name: bump version

# Manually triggered from the Actions tab. Bumps package.json (+ lockfile) on
# dev and prints a link to open the dev → main release PR. Open that PR
# yourself (one click) so CI runs on it; merging it deploys main and tags the
# release. (A PR auto-created by GITHUB_TOKEN wouldn't trigger CI, so the
# required check would never report — that's why we don't auto-create it.)
on:
  workflow_dispatch:
    inputs:
      level:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pull-requests: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Bump version on dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.level }} --no-git-tag-version
          v=$(node -p "require('./package.json').version")
          echo "VERSION=$v" >> "$GITHUB_ENV"
          git commit -am "chore: bump version to $v for release"
          git push origin dev
      - name: Release PR link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::notice title=Version bumped::v$VERSION pushed to dev."
          existing="$(gh pr list --base main --head dev --state open --json number -q '.[0].number' || true)"
          if [ -n "$existing" ]; then
            echo "A dev → main PR (#$existing) is already open; the bump was added to it."
          else
            echo "Open the release PR (CI will run on it so the required check reports):"
            echo "https://github.com/${{ github.repository }}/compare/main...dev?expand=1"
          fi
